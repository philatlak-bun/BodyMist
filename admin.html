<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ | Body Scent Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .table-wrap {
      overflow-x: auto;
      background: var(--color-white);
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
    }

    #ordersTable {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    #ordersTable th,
    #ordersTable td {
      padding: var(--space-2) var(--space-3);
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--color-line);
    }

    #ordersTable thead th {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--color-accent-dark);
      background: var(--color-cream);
      border-bottom: 1px solid var(--color-accent);
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }

    #ordersTable tbody tr:hover {
      background: var(--color-cream);
    }

    #ordersTable td:nth-child(1) { white-space: nowrap; }
    #ordersTable td:nth-child(5) {
      white-space: nowrap;
      font-family: var(--font-serif);
      font-size: 1.05rem;
      color: var(--color-accent-dark);
    }

    @media (max-width: 768px) {
      .site-header { position: static; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="logo">Body Scent</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-header">
          <span class="eyebrow">Admin</span>
          <h1>รายการสั่งซื้อ</h1>
          <hr class="divider">
          <p class="lead">เรียงจากรายการล่าสุดก่อน</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร/Line</th>
                <th>รายการสินค้า</th>
                <th>จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="logo">Body Scent</div>
      <p class="footer-note">&copy; 2026 Body Scent. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
