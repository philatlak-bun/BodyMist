<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .order-wrap {
      max-width: 620px;
      margin: 0 auto;
      padding: var(--space-5);
      background: var(--color-cream);
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
    }

    .order-wrap .textarea {
      min-height: 120px;
      resize: vertical;
    }

    .order-hint {
      margin: var(--space-3) 0 0;
      font-size: 0.85rem;
      text-align: center;
      color: var(--color-ink-muted);
    }

    .order-hint a {
      border-bottom: 1px solid var(--color-accent);
    }

    @media (max-width: 768px) {
      .site-header { position: static; }
      .order-wrap { padding: var(--space-3); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="logo">Body Scent</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- Page title -->
    <section class="hero">
      <div class="container">
        <span class="eyebrow">Order</span>
        <h1>สั่งซื้อสินค้า</h1>
        <hr class="divider">
        <p class="lead">กรอกข้อมูลของคุณ แล้วเราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
      </div>
    </section>

    <!-- Form -->
    <section class="section section--white">
      <div class="container">
        <div class="order-wrap">
          <form id="orderForm">
            <div class="field">
              <label for="customerName">ชื่อลูกค้า</label>
              <input class="input" type="text" id="customerName" name="customerName" autocomplete="name" required>
            </div>

            <div class="field">
              <label for="contact">เบอร์โทร / Line</label>
              <input class="input" type="text" id="contact" name="contact" autocomplete="tel" required>
            </div>

            <div class="field">
              <label for="items">รายการสินค้า</label>
              <input class="input" type="text" id="items" name="items" required>
            </div>

            <div class="field">
              <label for="total">จำนวนเงินรวม (บาท)</label>
              <input class="input" type="text" id="total" name="total" inputmode="numeric" required>
            </div>

            <div class="field">
              <label for="note">หมายเหตุ</label>
              <textarea class="textarea" id="note" name="note" placeholder="เช่น ที่อยู่จัดส่ง หรือข้อมูลเพิ่มเติม"></textarea>
            </div>

            <button type="submit" class="btn btn--solid btn--block">ยืนยันสั่งซื้อ</button>
          </form>

          <p class="order-hint">ยังไม่ได้เลือกสินค้า? <a href="product.html">ดูสินค้าทั้งหมด</a></p>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="logo">Body Scent</div>
      <nav class="footer-links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
      <p class="footer-note">&copy; 2026 Body Scent. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
